<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>SkillLab PH Student Lab</title>
<style>
:root{--bg:#07111f;--panel:#0d1a2b;--card:#101f33;--line:#28405e;--text:#f4f7fb;--muted:#91a7c0;--accent:#28d7a0;--accent2:#67e8f9;--warn:#f6c85f;--bad:#ff8b8b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#173b5e,transparent 34%),var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(980px,calc(100% - 22px));margin:auto;padding:20px 0 56px}.top,.row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.brandline{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#032018;font-weight:950}.brand{font-size:25px;font-weight:900}.ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}.muted{color:var(--muted)}.ok{color:#baffea}.warn{color:#ffe2a2}.bad{color:#ffb8b8}.grid{display:grid;gap:14px}.g2{grid-template-columns:1.25fr .75fr}.card{border:1px solid var(--line);background:rgba(16,31,51,.95);border-radius:17px;padding:18px}.hero{padding:24px}.hero h1{font-size:30px;line-height:1.08;margin:6px 0 8px}.form{display:grid;gap:12px}label{display:grid;gap:6px;font-size:12px;font-weight:700}input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#081421;color:var(--text);padding:0 12px;font-size:16px}textarea{min-height:78px;padding:10px 12px}.btn{min-height:44px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);padding:0 15px;font-weight:800;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#032018}.btn:disabled{opacity:.5}.progress{height:8px;background:#081421;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.coursebar{display:flex;gap:6px;flex-wrap:wrap}.coursebar span{width:30px;height:30px;border-radius:999px;display:grid;place-items:center;border:1px solid var(--line);font-size:11px;font-weight:900}.coursebar .done{background:rgba(40,215,160,.12);border-color:#2d846e;color:#baffea}.coursebar .current{border-color:var(--accent2);color:#c7f6ff}.coursebar .locked{color:#62758d}.scene{display:flex;justify-content:center;align-items:center;gap:34px;min-height:230px;border-radius:14px;background:radial-gradient(circle at 50% 0,#1b3859,#081421 65%);margin:12px 0}.screen{width:230px;height:125px;border:9px solid #18212b;background:#020508;display:grid;place-items:center;text-align:center;padding:12px;color:#91a7c0;border-radius:8px;font-weight:900}.screen.fixed{background:#0f5a50;color:#d7fff5}.tower{width:95px;height:180px;border:1px solid #4c6179;border-radius:11px;display:grid;place-items:center;font-size:42px}.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.acts button{min-height:44px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:9px;cursor:pointer}.acts button.used{border-color:#2d846e;color:#baffea}.log{margin-top:12px;padding:12px;background:#081421;border-radius:11px}.log p{margin:6px 0;color:var(--muted);font-size:12px}.score{font-size:44px;font-weight:950}.score.pass{color:#baffea}.score.fail{color:#ffb8b8}.notice{border:1px solid #4e6d8f;background:#0a1727;border-radius:12px;padding:12px}.lesson{border-left:4px solid var(--warn)}.flow{display:grid;gap:8px;margin-top:12px}.flow div{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#081421}.flow div:not(:last-child):after{content:'↓';display:block;text-align:center;margin:8px 0 -5px;color:var(--accent2);font-weight:900}.feedback{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.spin{display:inline-block;width:15px;height:15px;border:2px solid #58718d;border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;margin-right:7px;vertical-align:-3px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:760px){.g2{grid-template-columns:1fr}.acts,.feedback{grid-template-columns:1fr}.scene{gap:16px}.screen{width:165px;height:100px}.tower{width:75px;height:140px}.hero h1{font-size:25px}}
</style></head>
<body><div class="wrap"><header class="top"><div class="brandline"><div class="logo">SL</div><div><div class="ey ok">STUDENT LAB</div><div class="brand">SkillLab PH</div><div class="muted">Computer Systems Servicing</div></div></div><div class="muted">Pass score: 90/100</div></header><main id="app" class="grid" style="margin-top:20px"></main></div>
<script type="module">
const URL='https://pejqnbqxfodjlmgtdnxh.supabase.co',API=URL+'/functions/v1/skilllab-app',PROGRESS=URL+'/functions/v1/skilllab-progress',PASS=90;
const app=document.querySelector('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const post=async(url,body)=>{const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok&&!d.error)d.error='Request failed.';return d};const api=b=>post(API,b),prog=(student_name,class_code)=>post(PROGRESS,{student_name,class_code});const fmt=s=>s==null?'—':Number(s)<60?`${Number(s)}s`:`${Math.floor(Number(s)/60)}m ${Number(s)%60}s`;
const LESSONS={
'pc-no-display-001':{title:'No Display: Basic Diagnostic Flow',steps:['Confirm the monitor has power and the correct input is selected.','Check the display cable on both ends.','Observe POST behavior or beep/error indicators.','Check RAM seating before replacing parts.','Inspect the GPU connection and power only after the basic checks.'],tip:'Start with the simplest external cause, then move inward to hardware.'},
'pc-no-boot-002':{title:'No Boot Device: What to Check',steps:['Open BIOS/UEFI and confirm the storage drive is detected.','Check storage power/data connections.','Verify the OS drive is first in the valid boot order.','Confirm UEFI/Legacy mode matches how Windows was installed.'],tip:'Detected drive + wrong boot configuration is different from a drive that is not detected at all.'},
'pc-no-network-003':{title:'No Network Access: Layer-by-Layer Check',steps:['Look for physical link lights.','Confirm the network adapter is enabled.','Check the IP address and subnet.','Inspect the Ethernet cable and switch port.','Ping the default gateway.'],tip:'Check physical connectivity before changing IP settings.'},
'dns-connectivity-004':{title:'DNS Troubleshooting Flow',steps:['First confirm IP connectivity by pinging a known IP address.','Check which DNS server the PC is using.','Run a name lookup.','Check whether DHCP supplied the wrong DNS address.','Compare local cache results with direct DNS replies.'],tip:'If IP works but names fail, focus on name resolution instead of the physical network.'},
'windows-usb-install-005':{title:'Bootable USB Installation Flow',steps:['Confirm the USB was created as bootable installation media.','Select the USB in the boot menu.','Match GPT/MBR partition scheme with UEFI/Legacy mode.','Check Secure Boot compatibility.','Test the USB on another compatible computer if needed.'],tip:'A USB containing Windows files is not automatically a bootable installer.'},
'pc-overheating-006':{title:'Overheating Diagnostic Flow',steps:['Check CPU temperature at idle and under load.','Inspect dust on heatsinks and vents.','Confirm the CPU fan spins at normal speed.','Check heatsink mounting and thermal contact.','Inspect case airflow and fan direction.'],tip:'Fast temperature spikes often point to fan or heatsink-contact problems.'},
'pc-slow-storage-007':{title:'Slow PC and Storage Diagnosis',steps:['Check disk utilization during the slowdown.','Review drive health indicators.','Check available free space.','Review heavy startup applications.','Inspect storage cables and system logs for communication errors.'],tip:'High disk usage can come from a failing drive, low free space, or software load—use evidence to separate them.'},
'lan-testing-008':{title:'LAN Workstation Testing Flow',steps:['Test the network cable and termination.','Check the workstation IP and subnet mask.','Check for duplicate IP addresses.','Verify the default gateway.','Confirm switch link and run local ping tests.'],tip:'A correct IP address alone does not prove the cable, gateway, or uniqueness of the address is correct.'},
'dhcp-service-009':{title:'DHCP Service Troubleshooting',steps:['Check whether the DHCP service is running.','Confirm the correct scope is active.','Check whether the address pool still has free leases.','Confirm DHCP is bound to the correct LAN interface.','Renew a client lease and review server events.'],tip:'169.254.x.x usually means the client did not receive a usable DHCP lease.'},
'file-sharing-010':{title:'Shared Folder Access Flow',steps:['Confirm the server is reachable.','Confirm the folder is actually shared.','Check share permissions.','Check NTFS permissions.','Verify the credentials used by the client.','Confirm the file-sharing service is running.'],tip:'Effective access depends on both share permissions and NTFS permissions.'}
};
let catalog=[],name='',code='',p=null,sess=null,seen=[],logs=[],diag='',repair='',result=null,feedbackDone=false,lessonMode=false;
async function catalogLoad(){const x=await api({action:'catalog'});catalog=x.activities||[]}
function idx(slug){return Math.max(0,catalog.findIndex(a=>a.slug===slug))}
function coursebar(current){const done=new Set(p?.completed||[]);return `<div class="coursebar">${catalog.map((a,i)=>`<span class="${done.has(a.slug)?'done':a.slug===current?'current':'locked'}">${i+1}</span>`).join('')}</div>`}
async function start(slug){const x=await api({action:'join',student_name:name,class_code:code,activity_slug:slug});if(x.error)return x;sess=x;seen=[];logs=[x.intro];diag='';repair='';result=null;feedbackDone=false;lessonMode=false;return x}
async function refresh(){p=await prog(name,code);return p}
function login(){const pref=new URLSearchParams(location.search).get('class')||'';app.innerHTML=`<article class="card hero"><div class="ey">10-STEP CSS COURSE</div><h1>Complete each simulator in order.</h1><p class="muted">You need at least <b>90/100</b> to unlock the next simulator. If you score below 90, SkillLab gives you a short lesson before you retake that same simulator.</p></article><form id="go" class="card form"><label>Student full name<input id="name" maxlength="80" required></label><label>Class code<input id="code" value="${esc(pref)}" maxlength="8" required></label><div id="msg" class="muted"></div><button class="btn primary">Start / Resume</button></form>`;document.querySelector('#go').onsubmit=async e=>{e.preventDefault();name=document.querySelector('#name').value.trim().replace(/\s+/g,' ');code=document.querySelector('#code').value.trim().toUpperCase();const m=document.querySelector('#msg');m.innerHTML='<span class="spin"></span>Checking your progress…';await refresh();if(p.error){m.innerHTML='<span class="bad">'+esc(p.error)+'</span>';return}if(p.finished_all){completeScreen();return}const x=await start(p.next_slug);if(x.error){m.innerHTML='<span class="bad">'+esc(x.error)+'</span>';return}render()}}
function completeScreen(){app.innerHTML=`<article class="card hero"><div class="ey ok">COURSE COMPLETE</div><h1>Congratulations, ${esc(name)}.</h1><p>You passed all 10 SkillLab CSS simulators with the required score.</p><div class="progress"><span style="width:100%"></span></div><p class="ok"><b>10/10 complete</b></p></article><button class="btn" id="finish">Finish session</button>`;document.querySelector('#finish').onclick=()=>{name='';code='';p=null;login()}}
function breakScreen(){const next=catalog.find(a=>a.slug===p.next_slug),pct=Math.round((p.completed_count||0)/10*100);app.innerHTML=`<article class="card hero"><div class="ey ok">PROGRESS SAVED</div><h1>You can take a break now.</h1><p class="muted">Come back anytime using the same full name and class code. SkillLab will resume at your next unfinished simulator.</p><div class="progress"><span style="width:${pct}%"></span></div><p><b>${p.completed_count}/10 passed</b></p></article><article class="card"><div class="ey">NEXT SIMULATOR</div><h2>${esc(next?.title||'Course complete')}</h2><div class="row"><button class="btn primary" id="continue">Continue now</button><button class="btn" id="leave">End session</button></div></article>`;document.querySelector('#continue').onclick=async()=>{const x=await start(p.next_slug);if(x.error)return alert(x.error);render()};document.querySelector('#leave').onclick=()=>{name='';code='';p=null;sess=null;login()}}
function lesson(){const L=LESSONS[sess.activity_slug],n=idx(sess.activity_slug)+1;app.innerHTML=`<article class="card hero lesson"><div class="ey warn">REMEDIATION LESSON · SIMULATOR ${String(n).padStart(3,'0')}</div><h1>${esc(L.title)}</h1><p>You scored <b>${result.score}/100</b>. You need <b>${PASS}/100</b> to continue. Review this short flow, then retake the simulator.</p><div class="flow">${L.steps.map((s,i)=>`<div><b>${i+1}. ${esc(s)}</b></div>`).join('')}</div><div class="notice" style="margin-top:14px"><b>Remember:</b> ${esc(L.tip)}</div></article><article class="card"><div class="row"><button class="btn primary" id="retake">Retake Simulator ${String(n).padStart(3,'0')}</button><button class="btn" id="break">Take a break</button></div></article>`;document.querySelector('#retake').onclick=async()=>{const x=await start(sess.activity_slug);if(x.error)return alert(x.error);render()};document.querySelector('#break').onclick=async()=>{await refresh();sess=null;breakScreen()}}
function render(){if(!sess)return login();if(lessonMode)return lesson();const n=idx(sess.activity_slug)+1,eff=Math.max(55,100-Math.max(0,seen.length-2)*8),actions=sess.actions||[],opts=sess.options||[];app.innerHTML=`<article class="card"><div class="row"><div><div class="ey">COURSE PROGRESS</div><b>Simulator ${String(n).padStart(3,'0')} of 010</b></div>${coursebar(sess.activity_slug)}</div></article><div class="grid g2"><article class="card"><div class="row"><b>Virtual Workbench</b><span>Efficiency <b>${eff}%</b></span></div><div class="scene"><div class="screen ${result&&result.score>=PASS?'fixed':''}">${result&&result.score>=PASS?'PASSED':esc(sess.status_text||'SYSTEM FAULT')}</div><div class="tower">◉</div></div><div class="notice">${esc(sess.intro)}</div><h3>Diagnostic actions</h3><div class="acts">${actions.map(x=>`<button data-act="${x[0]}" class="${seen.includes(x[0])?'used':''}" ${seen.includes(x[0])||result?'disabled':''}>${seen.includes(x[0])?'✓ ':''}${esc(x[1])}</button>`).join('')}</div><div class="log"><div class="ey">OBSERVATION LOG</div>${logs.map((x,i)=>`<p>${i+1}. ${esc(x)}</p>`).join('')}</div></article><aside class="grid"><article class="card form"><label>Diagnosis<select id="dg" ${result?'disabled':''}><option value="">Select diagnosis</option>${opts.map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join('')}</select></label><label>Repair<select id="rp" ${result?'disabled':''}><option value="">Select repair</option>${opts.map(x=>`<option value="${x[0]}">${esc(x[2])}</option>`).join('')}</select></label>${result?'':'<button class="btn primary" id="submit">Complete troubleshooting</button>'}</article>${result?`<article class="card"><div class="ey ${result.score>=PASS?'ok':'bad'}">${result.score>=PASS?'PASSED':'NOT YET PASSED'}</div><div class="score ${result.score>=PASS?'pass':'fail'}">${result.score}/100</div><h3>${esc(result.mastery)}</h3><p class="muted">Required to continue: ${PASS}/100<br>Efficiency: ${result.efficiency}% · Time: ${fmt(result.duration_seconds)}</p>${result.score>=PASS?`<div class="row"><button class="btn primary" id="next">${n===10?'Finish course':'Continue to next simulator'}</button><button class="btn" id="takebreak">Take a break</button></div>`:`<p class="warn"><b>Review required.</b> A short lesson is ready before your retake.</p><button class="btn primary" id="lesson">Open short lesson</button>`}</article>${feedbackDone?'':`<article class="card form"><div class="ey">10-SECOND FEEDBACK</div><h3>How clear was this activity?</h3><div class="feedback"><button type="button" class="btn" data-f="clear">Clear</button><button type="button" class="btn" data-f="somewhat_confusing">Somewhat confusing</button><button type="button" class="btn" data-f="confusing">Confusing</button></div><label>Optional note<textarea id="note" maxlength="500"></textarea></label><div id="fm" class="muted"></div></article>`}`:''}</aside></div>`;document.querySelector('#dg').value=diag;document.querySelector('#rp').value=repair;document.querySelector('#dg').onchange=e=>diag=e.target.value;document.querySelector('#rp').onchange=e=>repair=e.target.value;document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const x=await api({action:'inspect',session_id:sess.session_id,inspect:b.dataset.act});if(x.error)return alert(x.error);if(!seen.includes(b.dataset.act))seen.push(b.dataset.act);logs.push(x.clue);render()});const sub=document.querySelector('#submit');if(sub)sub.onclick=async()=>{if(!diag||!repair)return alert('Choose a diagnosis and repair.');const x=await api({action:'submit',session_id:sess.session_id,diagnosis:diag,repair});if(x.error)return alert(x.error);result=x;await refresh();render()};const les=document.querySelector('#lesson');if(les)les.onclick=()=>{lessonMode=true;render()};const next=document.querySelector('#next');if(next)next.onclick=async()=>{await refresh();if(p.finished_all){completeScreen();return}const x=await start(p.next_slug);if(x.error)return alert(x.error);render()};const br=document.querySelector('#takebreak');if(br)br.onclick=async()=>{await refresh();sess=null;breakScreen()};document.querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{const m=document.querySelector('#fm');m.innerHTML='<span class="spin"></span>Saving…';const x=await api({action:'feedback',attempt_id:result.attempt_id,clarity:b.dataset.f,note:document.querySelector('#note')?.value||''});if(x.error){m.innerHTML='<span class="bad">'+esc(x.error)+'</span>';return}feedbackDone=true;render()})}
await catalogLoad();login();
</script></body></html>
