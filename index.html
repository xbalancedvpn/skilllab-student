p:8px;margin-top:12px}.quiz-options button{min-height:46px;text-align:left}.quiz-options button.correct{border-color:#2d846e}.quiz-options button.wrong{border-color:#9b4d4d}.drill-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.drill-actions button{min-height:48px;text-align:left}.readiness-ring{font-size:38px;font-weight:950}.stage-note{font-size:12px;color:var(--muted);line-height:1.5}.hub-coc{cursor:default}.hub-coc.active{border-color:#2d846e}.hub-coc.next{border-color:#4e6d8f}.wire-board{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:14px}.wire-slot{min-height:92px;border:1px dashed #4e6d8f;border-radius:10px;padding:7px;display:grid;align-content:start;gap:5px;background:#081421}.wire-slot b{font-size:11px}.wire-pick{min-height:42px;font-size:12px;text-align:left}.ip-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.checkline{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;background:#081421}.mini-flow{display:grid;gap:8px}.mini-flow button{text-align:left;min-height:48px}@media(max-width:780px){.wire-board{grid-template-columns:repeat(4,1fr)}.ip-grid{grid-template-columns:1fr}}

const LESSONS={"pc-no-display-001": {"title": "No Display: Basic Diagnostic Flow", "steps": ["Confirm the monitor has power and the correct input is selected.", "Check the display cable on both ends.", "Observe POST behavior or beep/error indicators.", "Check RAM seating before replacing parts.", "Inspect the GPU connection and power only after the basic checks."], "tip": "Start with the simplest external cause, then move inward to hardware."}, "pc-no-boot-002": {"title": "No Boot Device: What to Check", "steps": ["Open BIOS/UEFI and confirm the storage drive is detected.", "Check storage power/data connections.", "Verify the OS drive is first in the valid boot order.", "Confirm UEFI/Legacy mode matches how Windows was installed."], "tip": "Detected drive + wrong boot configuration is different from a drive that is not detected at all."}, "pc-no-network-003": {"title": "No Network Access: Layer-by-Layer Check", "steps": ["Look for physical link lights.", "Confirm the network adapter is enabled.", "Check the IP address and subnet.", "Inspect the Ethernet cable and switch port.", "Ping the default gateway."], "tip": "Check physical connectivity before changing IP settings."}, "dns-connectivity-004": {"title": "DNS Troubleshooting Flow", "steps": ["First confirm IP connectivity by pinging a known IP address.", "Check which DNS server the PC is using.", "Run a name lookup.", "Check whether DHCP supplied the wrong DNS address.", "Compare local cache results with direct DNS replies."], "tip": "If IP works but names fail, focus on name resolution instead of the physical network."}, "windows-usb-install-005": {"title": "Bootable USB Installation Flow", "steps": ["Confirm the USB was created as bootable installation media.", "Select the USB in the boot menu.", "Match GPT/MBR partition scheme with UEFI/Legacy mode.", "Check Secure Boot compatibility.", "Test the USB on another compatible computer if needed."], "tip": "A USB containing Windows files is not automatically a bootable installer."}, "pc-overheating-006": {"title": "Overheating Diagnostic Flow", "steps": ["Check CPU temperature at idle and under load.", "Inspect dust on heatsinks and vents.", "Confirm the CPU fan spins at normal speed.", "Check heatsink mounting and thermal contact.", "Inspect case airflow and fan direction."], "tip": "Fast temperature spikes often point to fan or heatsink-contact problems."}, "pc-slow-storage-007": {"title": "Slow PC and Storage Diagnosis", "steps": ["Check disk utilization during the slowdown.", "Review drive health indicators.", "Check available free space.", "Review heavy startup applications.", "Inspect storage cables and system logs for communication errors."], "tip": "High disk usage can come from a failing drive, low free space, or software load—use evidence to separate them."}, "lan-testing-008": {"title": "LAN Workstation Testing Flow", "steps": ["Test the network cable and termination.", "Check the workstation IP and subnet mask.", "Check for duplicate IP addresses.", "Verify the default gateway.", "Confirm switch link and run local ping tests."], "tip": "A correct IP address alone does not prove the cable, gateway, or uniqueness of the address is correct."}, "dhcp-service-009": {"title": "DHCP Service Troubleshooting", "steps": ["Check whether the DHCP service is running.", "Confirm the correct scope is active.", "Check whether the address pool still has free leases.", "Confirm DHCP is bound to the correct LAN interface.", "Renew a client lease and review server events."], "tip": "169.254.x.x usually means the client did not receive a usable DHCP lease."}, "file-sharing-010": {"title": "Shared Folder Access Flow", "steps": ["Confirm the server is reachable.", "Confirm the folder is actually shared.", "Check share permissions.", "Check NTFS permissions.", "Verify the credentials used by the client.", "Confirm the file-sharing service is running."], "tip": "Effective access depends on both share permissions and NTFS permissions."}};

{n:1,title:'Assemble computer hardware',points:['Plan the assembly and follow occupational health and safety procedures.','Check required materials against the system requirements before installation.','Prepare safe, working tools and testing devices.','Assemble the motherboard, storage, power supply and peripherals using the correct procedure.','Configure BIOS/UEFI according to hardware and system requirements.'],check:'Before powering on, verify connections, component seating, cooling and power requirements.'},

  <div class="grid g2">

function coc2CableDrill(){

function trainKeyC3(){return 'skilllab-nc2-v1:'+String(user?.id||'guest')+':'+String(p?.class_id||code||'class')+':coc3'}
function trainStateC3(){try{return JSON.parse(localStorage.getItem(trainKeyC3())||'{}')}catch{return{}}}
function setTrainC3(patch){const v={...trainStateC3(),...patch,updated_at:new Date().toISOString()};localStorage.setItem(trainKeyC3(),JSON.stringify(v));return v}
function coc3Pct(st=trainStateC3()){return Math.round(((st.learn_done?1:0)+(Number(st.practice_best||0)>=PASS?1:0)+(st.access_done?1:0)+(st.services_done?1:0))/4*100)}
function coc3Ready(){const st=trainStateC3();return !!(st.learn_done&&Number(st.practice_best||0)>=PASS&&st.access_done&&st.services_done)}

function coursebar(current){const done=new Set(p?.completed||[]);return `<div class="coursebar">${catalog.map((a,i)=>`<span class="${done.has(a.slug)?'done':a.slug===current?'current':'locked'}">${i+1}</span>`).join('')}</div>`}
function completeScreen(){app.innerHTML=`<article class="card hero"><div class="ey ok">FOUNDATION SIMULATION SET COMPLETE</div><h1>Strong progress, ${esc(publicName)}.</h1><p>You passed all 10 current SkillLab CSS simulations with at least ${PASS}/100. This completes the present foundation bank across the four CSS NC II core competencies.</p><div class="progress"><span style="width:100%"></span></div><p class="ok"><b>10/10 complete</b></p><button id="completehub" class="btn">Return to NC II Readiness Hub</button></article>`;setTimeout(()=>{const b=document.querySelector('#completehub');if(b)b.onclick=nc2Hub},0)}
function lesson(){const L=LESSONS[sess.activity_slug],n=idx(sess.activity_slug)+1;app.innerHTML=`<article class="card hero lesson"><div class="ey warn">REMEDIATION LESSON · SIMULATOR ${String(n).padStart(3,'0')}</div><h1>${esc(L.title)}</h1><p>You scored <b>${result.score}/100</b>. Review this flow, then retake.</p><div class="flow">${L.steps.map((s,i)=>`<div><b>${i+1}. ${esc(s)}</b></div>`).join('')}</div><div class="notice" style="margin-top:14px"><b>Remember:</b> ${esc(L.tip)}</div></article><article class="card row"><button class="btn primary" id="retake">Retake Simulator ${String(n).padStart(3,'0')}</button><button class="btn" id="break">Take a break</button></article>`;document.querySelector('#retake').onclick=async()=>{const x=await start(sess.activity_slug);if(x.error)return alert(x.error);render()};document.querySelector('#break').onclick=nc2Hub}
function render(){if(lessonMode)return lesson();const n=idx(sess.activity_slug)+1,eff=result?.efficiency??liveEff,actions=sess.actions||[],legacy=sess.options||[],diagOpts=sess.diagnosis_options||legacy.map(x=>[x[0],x[1]]),repairOpts=sess.repair_options||legacy.map(x=>[x[0],x[2]]);app.innerHTML=`<article class="card"><div class="row"><div><div class="ey">NC II PREPARATION PROGRESS</div><b>Simulator ${String(n).padStart(3,'0')} of 010 · ${esc(cocFor(sess.activity_slug)?.short||'Core competency')}</b></div>${coursebar(sess.activity_slug)}</div></article>${cocCards(sess.activity_slug)}<div class="grid g2"><article class="card"><div class="row"><b>Virtual Workbench</b><span>Efficiency <b>${eff}%</b></span></div><div class="scene"><div class="screen ${result&&result.score>=PASS?'fixed':''}">${result&&result.score>=PASS?'PASSED':esc(sess.status_text||'SYSTEM FAULT')}</div><div class="tower">◉</div></div><div class="notice">${esc(sess.intro)}</div><div class="notice" style="margin-top:10px"><b>Evidence requirement:</b> collect at least ${sess.min_evidence||2} diagnostic observations before submitting. Relevant evidence helps your score; unnecessary checks reduce efficiency.</div><h3>Diagnostic actions</h3><div class="acts">${actions.map(x=>`<button data-act="${x[0]}" class="${seen.includes(x[0])?'used':''}" ${seen.includes(x[0])||result?'disabled':''}>${seen.includes(x[0])?'✓ ':''}${esc(x[1])}</button>`).join('')}</div><div class="log"><div class="ey">OBSERVATION LOG</div>${logs.map((x,i)=>`<p>${i+1}. ${esc(x)}</p>`).join('')}</div></article><aside class="grid"><article class="card form"><label>Diagnosis<select id="dg" ${result?'disabled':''}><option value="">Select diagnosis</option>${diagOpts.map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join('')}</select></label><label>Repair<select id="rp" ${result?'disabled':''}><option value="">Select repair</option>${repairOpts.map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join('')}</select></label>${result?'':'<button class="btn primary" id="submit">Complete troubleshooting</button>'}</article>${result?`<article class="card"><div class="ey ${result.score>=PASS?'ok':'bad'}">${result.score>=PASS?'PASSED':'NOT YET PASSED'}</div><div class="score ${result.score>=PASS?'pass':'fail'}">${result.score}/100</div><h3>${esc(result.mastery)}</h3><p class="muted">Required to continue: ${PASS}/100<br>Evidence: ${result.evidence_score??'—'}/30 · Efficiency: ${result.efficiency}% · Time: ${fmt(result.duration_seconds)}${result.unnecessary_steps!=null?`<br>Unnecessary checks: ${result.unnecessary_steps}`:''}</p>${result.score>=PASS?`<div class="row"><button class="btn primary" id="next">${n===10?'Finish course':'Continue to next simulator'}</button><button class="btn" id="takebreak">Take a break</button></div>`:`<p class="warn"><b>Review required.</b></p><button class="btn primary" id="lesson">Open short lesson</button>`}</article>${feedbackDone?'':`<article class="card form"><div class="ey">10-SECOND FEEDBACK</div><h3>How clear was this activity?</h3><div class="feedback"><button type="button" class="btn" data-f="clear">Clear</button><button type="button" class="btn" data-f="somewhat_confusing">Somewhat confusing</button><button type="button" class="btn" data-f="confusing">Confusing</button></div><label>Optional note<textarea id="note" maxlength="500"></textarea></label><div id="fm" class="muted"></div></article>`}`:''}</aside></div>`;
const dg=document.querySelector('#dg'),rp=document.querySelector('#rp');if(dg){dg.value=diag;dg.onchange=e=>diag=e.target.value}if(rp){rp.value=repair;rp.onchange=e=>repair=e.target.value}
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const x=await api({action:'inspect',session_id:sess.session_id,inspect:b.dataset.act});if(x.error)return alert(x.error);if(!seen.includes(b.dataset.act))seen.push(b.dataset.act);liveEff=Number(x.efficiency??liveEff);logs.push(x.clue);render()});
const sub=document.querySelector('#submit');if(sub)sub.onclick=async()=>{if(!diag||!repair)return alert('Choose a diagnosis and repair.');const x=await api({action:'submit',session_id:sess.session_id,diagnosis:diag,repair});if(x.error)return alert(x.error);if(x.pass_score){PASS=Number(x.pass_score);passlabel.textContent='Pass score: '+PASS+'/100'}result=x;await refresh();render()};
const les=document.querySelector('#lesson');if(les)les.onclick=()=>{lessonMode=true;render()};
const next=document.querySelector('#next');if(next)next.onclick=async()=>{await refresh();if(p.finished_all)return completeScreen();const x=await start(p.next_slug);if(x.error)return alert(x.error);render()};
const br=document.querySelector('#takebreak');if(br)br.onclick=nc2Hub;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{const x=await api({action:'feedback',attempt_id:result.attempt_id,clarity:b.dataset.f,note:document.querySelector('#note')?.value||''});if(x.error)return alert(x.error);feedbackDone=true;render()})}
signout.onclick=async()=>{await sb.auth.signOut();user=null;authScreen()};boot();
</script></body></html>
